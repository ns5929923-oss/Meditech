<!DOCTYPE html>
<html>
<head>
    <title>Doctor Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">Doctor Registration</h3>

        <form method="POST">

            <input type="text" name="name" class="form-control mb-3" placeholder="Full Name" required>

            <input type="email" name="email" class="form-control mb-3" placeholder="Email" required>

            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>

            <input type="text" name="license" class="form-control mb-3" placeholder="License Number" required>

            <input type="text" name="speciality" class="form-control mb-3" placeholder="Speciality" required>

            <button class="btn btn-success w-100">Register</button>

        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="/doctor/login">Login</a>
        </p>
    </div>
</div>

</body>
</html>
